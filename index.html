<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#b3261e">
<title>Próximos trenes Belgrano Norte</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#f6f4f1; --card:#ffffff; --ink:#1c1b1a; --muted:#6b6661; --line:#e4dfd9;
  --brand:#b3261e; --brand-ink:#ffffff; --soft:#f9e9e7; --ok:#1d6b3a; --warn:#8a5a00; --warn-bg:#fff4d6;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#141312; --card:#1f1d1c; --ink:#f1ede8; --muted:#a39c95; --line:#34302d;
    --brand:#e5645b; --brand-ink:#1a0806; --soft:#3a1c19; --ok:#7fd49b; --warn:#f2c462; --warn-bg:#3a2e10; }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-tap-highlight-color:transparent}
main{max-width:560px;margin:0 auto;padding:14px 14px 40px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 2px 10px}
header.top h1{font-size:15px;font-weight:700;margin:0;letter-spacing:.02em;text-transform:uppercase;color:var(--brand)}
#clock{font-variant-numeric:tabular-nums;font-weight:600;color:var(--muted);font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.station .label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.station h2{font-size:28px;line-height:1.1;margin:2px 0 6px;font-weight:800}
.station .sub{font-size:14px;color:var(--muted);min-height:20px}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--brand);margin-right:6px;vertical-align:1px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
button{font:inherit;color:inherit;cursor:pointer}
.btn{min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-weight:650;padding:8px 10px}
.btn[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.actions .wide{grid-column:1/-1}
header.top .tr{display:flex;align-items:center;gap:10px}
.tbtn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px;min-height:34px;font-size:13px;font-weight:650;color:var(--brand)}
.route{display:flex;gap:8px;margin-top:12px;align-items:stretch}
.route .dest{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 12px;min-height:58px}
.dlabel{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.dname{font-size:18px;font-weight:750;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dnote{font-size:12.5px;color:var(--muted)}
.icon{flex:none;width:52px;border:1px solid var(--line);background:var(--bg);border-radius:12px;font-size:22px;line-height:1;color:var(--brand)}
.icon:disabled{opacity:.35;cursor:default}
.icon[aria-pressed="true"]{background:var(--soft);border-color:var(--brand)}
ul.deps.trips li{display:block;padding:0}
.triprow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;width:100%;text-align:left;border:0;background:transparent;padding:11px 2px;min-height:56px}
.triprow .dest{font-size:15.5px}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn[hidden]{display:none}
.near{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 10px;font-size:13px;min-height:34px}
.notice{margin-top:10px;padding:9px 11px;border-radius:10px;background:var(--warn-bg);color:var(--warn);font-size:13.5px}
.daytype{margin:14px 4px 4px;font-size:13.5px;color:var(--muted)}
.daytype b{color:var(--ink)}
section.dir{margin-top:10px}
section.dir h3{display:flex;align-items:center;gap:8px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 4px 6px;font-weight:700}
section.dir h3 .ttl{flex:1;min-width:0}
.hbtn{flex:none;border:1px solid var(--line);background:var(--card);color:var(--brand);border-radius:999px;padding:4px 12px;min-height:32px;font-size:13px;font-weight:650;text-transform:none;letter-spacing:0}
section.dir h3 b{color:var(--ink)}
section.dir h3 small{text-transform:none;letter-spacing:0;font-weight:500;font-size:12.5px}
ul.deps{list-style:none;margin:0;padding:0}
ul.deps li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:11px 2px;border-top:1px solid var(--line)}
ul.deps li:first-child{border-top:0}
.time{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
li.first .time{color:var(--brand)}
.dest{font-size:14.5px;font-weight:600}
.meta{font-size:12.5px;color:var(--muted)}
.eta{font-size:14px;font-weight:700;text-align:right;white-space:nowrap;color:var(--ok)}
.eta.far{color:var(--muted);font-weight:600}
.empty{color:var(--muted);font-size:14px;padding:8px 2px}
.more{width:100%;margin-top:6px;border:0;background:transparent;color:var(--brand);font-weight:650;min-height:40px}
footer{margin:18px 4px 0;font-size:12px;color:var(--muted)}
/* selector */
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:10}
#sheet.open{display:flex}
#sheet .panel{background:var(--card);width:100%;max-width:560px;max-height:86vh;border-radius:18px 18px 0 0;display:flex;flex-direction:column}
#sheet .head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
#sheet .head strong{font-size:17px}
#sheet .close{border:0;background:transparent;font-size:15px;font-weight:650;color:var(--brand);min-height:40px}
#sheet .list{overflow:auto;padding:6px 8px 18px}
.opt{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;border:0;background:transparent;padding:12px 10px;border-radius:10px;min-height:48px;font-size:16px}
.opt.sel{background:var(--soft);color:var(--brand);font-weight:700}
.opt small{color:var(--muted);font-size:13px;font-weight:500}
.opt.dis{opacity:.38}
.opt .mark{color:var(--brand);font-size:15px;font-weight:700}
.group{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:10px 10px 4px}
.hint{font-size:13.5px;color:var(--muted);padding:8px 10px 6px}
.opt.auto{font-weight:700;border-bottom:1px solid var(--line);border-radius:10px 10px 0 0;margin-bottom:4px}
</style>
</head>
<body>
<main>
  <header class="top"><h1>Belgrano Norte</h1><span class="tr"><span id="clock"></span><button class="tbtn" id="btnSettings" type="button">Ajustes</button></span></header>

  <div class="card station">
    <div class="label" id="modeLabel">Origen</div>
    <h2 id="stName">...</h2>
    <div class="sub" id="stSub"></div>
    <div class="near" id="near"></div>
    <div class="notice" id="notice" hidden></div>
    <div class="route">
      <button class="dest" id="btnDest" type="button"><span class="dlabel">Destino</span><span class="dname" id="destName">Todos los trenes</span><span class="dnote" id="destNote"></span></button>
      <button class="icon" id="btnSwap" type="button" aria-label="Invertir origen y destino">⇄</button>
      <button class="icon" id="btnStar" type="button" aria-label="Guardar trayecto favorito" aria-pressed="false">☆</button>
    </div>
    <div class="actions">
      <button class="btn" id="btnStation" type="button">Cambiar origen</button>
      <button class="btn" id="btnHoliday" type="button" aria-pressed="false">Hoy es feriado</button>
      <button class="btn wide" id="btnFavs" type="button">Trayectos favoritos</button>
      <button class="btn wide primary" id="btnInstall" type="button" hidden>Instalar app</button>
    </div>
  </div>

  <div class="daytype" id="dayType"></div>

  <div id="sections"></div>

  <footer id="foot"></footer>
</main>

<div id="sheet" role="dialog" aria-modal="true" aria-label="Elegir estación">
  <div class="panel">
    <div class="head"><strong id="sheetTitle">Elegir estación</strong><button class="close" id="sheetClose" type="button">Cerrar</button></div>
    <div class="list" id="sheetList"></div>
  </div>
</div>

<script>
"use strict";
/* === instalación como app ===
   El navegador avisa con beforeinstallprompt cuando la app se puede instalar (Chrome y Edge).
   Se guarda el aviso y se muestra el botón; al tocarlo se abre el diálogo de instalación.
   Si la app ya está instalada, o el navegador no ofrece instalación, el botón queda oculto. */
(function(){
  const btn = document.getElementById("btnInstall");
  let aviso = null;
  window.addEventListener("beforeinstallprompt", function(e){ e.preventDefault(); aviso = e; btn.hidden = false; });
  window.addEventListener("appinstalled", function(){ aviso = null; btn.hidden = true; });
  btn.onclick = async function(){
    if (!aviso) return;
    const e = aviso; aviso = null; btn.hidden = true;   // cada aviso sirve una sola vez
    try { await e.prompt(); await e.userChoice; } catch (err) {}
  };
})();
(async function main(){
/* Los horarios y las estaciones viven en horarios.json, la única fuente de datos */
const DATA = await (await fetch("horarios.json")).json();
const ST = DATA.estaciones, LAST = ST.length - 1, TZ = "America/Argentina/Buenos_Aires";
const DAY_NAMES = { lav: "Lunes a viernes", sab: "Sábado", dyf: "Domingo o feriado" };

/* === almacenamiento local (puede no estar disponible) === */
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch(e){} }
};

/* === hora de Buenos Aires === */
const fmt = new Intl.DateTimeFormat("en-CA", { timeZone: TZ, hourCycle: "h23", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit", weekday: "short" });
function nowBA(d){
  const p = {}; for (const x of fmt.formatToParts(d || new Date())) p[x.type] = x.value;
  const dow = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].indexOf(p.weekday);
  return { date: p.year + "-" + p.month + "-" + p.day, dow, minutes: (+p.hour) * 60 + (+p.minute) + (+p.second) / 60, hhmm: p.hour + ":" + p.minute };
}
function dayTypeOfDow(dow){ return dow === 0 ? "dyf" : dow === 6 ? "sab" : "lav"; }

/* === preproceso: minutos crecientes por tren (maneja el cruce de medianoche) === */
for (const day in DATA.servicios) for (const dir in DATA.servicios[day]) for (const t of DATA.servicios[day][dir]) {
  let prev = -1, add = 0;
  t.m = t.horarios.map(h => { let v = (+h.slice(0,2)) * 60 + (+h.slice(3)) + add; if (v < prev) { add += 1440; v += 1440; } prev = v; return v; });
}

/* Próximas salidas desde la estación s en el sentido dir.
   Considera los trenes de ayer que cruzan la medianoche, los de hoy y los primeros de mañana. */
function departures(s, dir, now, holidayToday, limit){
  const pos = dir === "ida" ? s : LAST - s, out = [];
  for (const off of [-1, 0, 1]) {
    const dow = (now.dow + off + 7) % 7;
    const type = (off === 0 && holidayToday) ? "dyf" : dayTypeOfDow(dow);
    for (const t of DATA.servicios[type][dir]) {
      const i = pos - t.desde;
      if (i < 0 || i >= t.m.length - 1) continue;          // no para aquí, o es su terminal
      const abs = t.m[i] + off * 1440;
      if (abs < now.minutes - 0.5) continue;
      const endPos = t.desde + t.m.length - 1;
      out.push({ abs, hhmm: t.horarios[i], tren: t.tren, dest: ST[dir === "ida" ? endPos : LAST - endPos].nombre,
                 arr: t.horarios[t.m.length - 1], tomorrow: abs >= 1440 });
    }
  }
  out.sort((a, b) => a.abs - b.abs);
  return out.slice(0, limit);
}

/* Próximas salidas desde la estación s que también paran en la estación dst.
   Devuelve la hora de salida, la de llegada a dst y la duración del viaje. */
function departuresTo(s, dst, now, holidayToday, limit){
  const dir = dst > s ? "ida" : "vuelta";
  const ps = dir === "ida" ? s : LAST - s, pd = dir === "ida" ? dst : LAST - dst, out = [];
  for (const off of [-1, 0, 1]) {
    const dow = (now.dow + off + 7) % 7;
    const type = (off === 0 && holidayToday) ? "dyf" : dayTypeOfDow(dow);
    for (const t of DATA.servicios[type][dir]) {
      const i = ps - t.desde, j = pd - t.desde;
      if (i < 0 || j >= t.m.length) continue;               // no para en alguna de las dos
      const abs = t.m[i] + off * 1440;
      if (abs < now.minutes - 0.5) continue;
      out.push({ abs, hhmm: t.horarios[i], tren: t.tren, arr: t.horarios[j], dur: t.m[j] - t.m[i], tomorrow: abs >= 1440 });
    }
  }
  out.sort((a, b) => a.abs - b.abs);
  return out.slice(0, limit);
}

/* === geolocalización === */
function distKm(a, b, c, d){
  const R = 6371, r = Math.PI / 180, x = (c - a) * r, y = (d - b) * r;
  const h = Math.sin(x/2) ** 2 + Math.cos(a*r) * Math.cos(c*r) * Math.sin(y/2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function fmtDist(km){ return km < 1 ? Math.round(km * 1000 / 10) * 10 + " m" : km.toFixed(km < 10 ? 1 : 0).replace(".", ",") + " km"; }

const state = {
  manual: null,          // id de estación elegida a mano, o null para automático
  pos: null,             // {lat, lon, acc}
  geoError: null,
  locating: false,
  holidayDate: store.get("bn.feriado"),
  trips: [],             // trayectos favoritos: pares [a, b] de ids, válidos en ambos sentidos
  destSel: "auto",       // destino: "auto" (trayecto favorito desde el origen), "todos" o id de estación
  view: "completa",      // "completa": trayecto activo y otros favoritos; "simple": solo el activo
  more: {}               // secciones expandidas, por clave
};
const MAX_TRIPS = 3;
/* Cabecera destino elegida por sentido (id de estación), o null para todos los trenes */
state.dest = { ida: null, vuelta: null };
try {
  const d = JSON.parse(store.get("bn.destino") || "{}");
  for (const k of ["ida", "vuelta"]) if (Number.isInteger(d[k]) && ST[d[k]]) state.dest[k] = d[k];
} catch (e) {}
/* Cabeceras: estaciones donde termina al menos un tren, por sentido y en orden de marcha */
const CABECERAS = { ida: new Set(), vuelta: new Set() };
for (const day in DATA.servicios) for (const dir of ["ida", "vuelta"]) for (const t of DATA.servicios[day][dir]) {
  const end = t.desde + t.horarios.length - 1;
  CABECERAS[dir].add(dir === "ida" ? end : LAST - end);
}
try {
  const t = JSON.parse(store.get("bn.trayectos") || "[]");
  if (Array.isArray(t)) state.trips = t.filter(p => Array.isArray(p) && p.length === 2 && Number.isInteger(p[0]) && Number.isInteger(p[1])
    && ST[p[0]] && ST[p[1]] && p[0] !== p[1]).slice(0, MAX_TRIPS);
} catch (e) {}
{ const d = store.get("bn.destino_sel");
  if (d === "todos") state.destSel = "todos";
  else if (d !== null && /^\d+$/.test(d) && ST[+d]) state.destSel = +d; }
state.view = store.get("bn.vista") === "simple" ? "simple" : "completa";
store.set("bn.favoritas", null);   // las estaciones favoritas fueron reemplazadas por trayectos
{ const m = store.get("bn.manual"); if (m !== null && ST[+m]) state.manual = +m; }
const lastAuto = store.get("bn.ultima");

function ranked(){
  if (!state.pos) return null;
  return ST.map(e => ({ id: e.id, km: distKm(state.pos.lat, state.pos.lon, e.lat, e.lon) })).sort((a, b) => a.km - b.km);
}
function currentStation(){
  if (state.manual !== null) return state.manual;
  const r = ranked(); if (r) return r[0].id;
  if (lastAuto !== null && ST[+lastAuto]) return +lastAuto;
  return 0;
}
function locate(){
  if (!("geolocation" in navigator)) { state.geoError = "Este navegador no ofrece geolocalización."; render(); return; }
  state.locating = true; render();
  try {
    navigator.geolocation.getCurrentPosition(p => {
      state.locating = false; state.geoError = null;
      state.pos = { lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy };
      const r = ranked(); if (r) store.set("bn.ultima", String(r[0].id));
      render();
    }, err => {
      state.locating = false;
      state.geoError = err && err.code === 1 ? "No hay permiso para usar la ubicación." : "No se pudo obtener la ubicación.";
      render();
    }, { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 });
  } catch (e) { state.locating = false; state.geoError = "No se pudo obtener la ubicación."; render(); }
}

/* === interfaz === */
const $ = id => document.getElementById(id);
function el(tag, cls, text){ const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
function etaText(mins){
  if (mins < 1) return "Ahora";
  const m = Math.round(mins);
  if (m < 60) return "en " + m + " min";
  return "en " + Math.floor(m / 60) + " h " + (m % 60) + " min";
}

/* === trayectos === */
const sentido = (from, to) => "sentido " + (to > from ? "Villa Rosa" : "Retiro");
function tripIndex(a, b){ return state.trips.findIndex(p => (p[0] === a && p[1] === b) || (p[0] === b && p[1] === a)); }
function saveTrips(){ store.set("bn.trayectos", JSON.stringify(state.trips)); }
function setDestSel(v){ state.destSel = v; store.set("bn.destino_sel", String(v)); state.more = {}; }

/* Destino activo desde el origen s: { id, fav, auto } o null para todos los trenes.
   Un destino igual al origen nunca se usa: se recurre a un trayecto favorito con extremo en s. */
function activeDest(s){
  const sel = state.destSel;
  if (typeof sel === "number" && sel !== s) return { id: sel, fav: tripIndex(s, sel) >= 0, auto: false };
  if (sel === "todos") return null;
  const p = state.trips.find(p => p[0] === s || p[1] === s);
  return p ? { id: p[0] === s ? p[1] : p[0], fav: true, auto: true } : null;
}

/* Secciones a mostrar: el trayecto activo, o una por sentido si el destino es "todos los trenes" */
function sectionsFor(s){
  const d = activeDest(s);
  if (d) return [{ key: "r" + d.id, pre: "A ", name: ST[d.id].nombre, sub: sentido(s, d.id), target: d.id }];
  const out = [];
  for (const dir of ["ida", "vuelta"]) {
    if ((dir === "ida" && s === LAST) || (dir === "vuelta" && s === 0)) continue;   // desde una terminal hay un solo sentido
    const c = state.dest[dir], valid = c !== null && (dir === "ida" ? c > s : c < s);
    const terminal = dir === "ida" ? "Villa Rosa" : "Retiro";
    if (valid) out.push({ key: dir + c, pre: "A ", name: ST[c].nombre, sub: "sentido " + terminal, target: c, dir, editable: true });
    else out.push({ key: dir, pre: "Hacia ", name: terminal, dir, editable: true });
  }
  return out;
}

/* Otros trayectos favoritos en forma compacta, cada uno desde el extremo más cercano al origen */
function renderTrips(s, d, now, holiday){
  const others = state.trips.filter(p => !(d && tripIndex(s, d.id) >= 0 && ((p[0] === s && p[1] === d.id) || (p[1] === s && p[0] === d.id))));
  if (!others.length) return;
  const wrap = el("section", "dir"), h = el("h3"), card = el("div", "card"), ul = el("ul", "deps trips");
  h.appendChild(el("span", "ttl", d ? "Otros trayectos favoritos" : "Trayectos favoritos"));
  wrap.appendChild(h); card.appendChild(ul); wrap.appendChild(card); $("sections").appendChild(wrap);
  for (const p of others) {
    const from = Math.abs(p[1] - s) < Math.abs(p[0] - s) ? p[1] : p[0], to = from === p[0] ? p[1] : p[0];
    const nx = departuresTo(from, to, now, holiday, 1)[0];
    const li = el("li"), b = el("button", "triprow"); b.type = "button";
    const mid = el("div");
    mid.appendChild(el("div", "dest", ST[from].nombre + " → " + ST[to].nombre));
    mid.appendChild(el("div", "meta", nx ? "sale " + nx.hhmm + " · llega " + nx.arr + " · " + Math.round(nx.dur) + " min" + (nx.tomorrow ? " · mañana" : "") : "Sin salidas programadas"));
    b.appendChild(mid);
    if (nx) { const mins = nx.abs - now.minutes; b.appendChild(el("div", "eta" + (mins >= 60 ? " far" : ""), etaText(mins))); }
    b.setAttribute("aria-label", "Ver trayecto " + ST[from].nombre + " a " + ST[to].nombre);
    b.onclick = () => {
      state.manual = from; store.set("bn.manual", String(from)); setDestSel(to); render();
      try { window.scrollTo({ top: 0, behavior: "smooth" }); } catch (e) {}
    };
    li.appendChild(b); ul.appendChild(li);
  }
}

function renderSections(s, now, holiday){
  const box = $("sections"); box.textContent = "";
  for (const sec of sectionsFor(s)) {
    const wrap = el("section", "dir"), h = el("h3"), ttl = el("span", "ttl", sec.pre);
    ttl.appendChild(el("b", "", sec.name));
    if (sec.sub) { ttl.appendChild(document.createTextNode(" ")); ttl.appendChild(el("small", "", "(" + sec.sub + ")")); }
    h.appendChild(ttl);
    if (sec.editable) {
      const cb = el("button", "hbtn", "Cambiar destino"); cb.type = "button";
      cb.setAttribute("aria-label", "Cambiar la cabecera destino del sentido " + (sec.dir === "ida" ? "Villa Rosa" : "Retiro"));
      cb.onclick = () => openDest(sec.dir, s);
      h.appendChild(cb);
    }
    wrap.appendChild(h);
    const card = el("div", "card"), ul = el("ul", "deps"); card.appendChild(ul); wrap.appendChild(card); box.appendChild(wrap);
    const n = state.more[sec.key] ? 15 : 4;
    const deps = sec.target !== undefined ? departuresTo(s, sec.target, now, holiday, n) : departures(s, sec.dir, now, holiday, n);
    if (!deps.length) { ul.appendChild(el("li", "empty", "No hay más salidas programadas.")); continue; }
    deps.forEach((d, k) => {
      const li = el("li", k === 0 ? "first" : "");
      li.appendChild(el("div", "time", d.hhmm));
      const mid = el("div");
      if (sec.target !== undefined) {
        mid.appendChild(el("div", "dest", "llega " + d.arr));
        mid.appendChild(el("div", "meta", Math.round(d.dur) + " min de viaje · Tren " + d.tren + (d.tomorrow ? " · mañana" : "")));
      } else {
        mid.appendChild(el("div", "dest", "a " + d.dest));
        mid.appendChild(el("div", "meta", "Tren " + d.tren + " · llega " + d.arr + (d.tomorrow ? " · mañana" : "")));
      }
      li.appendChild(mid);
      const mins = d.abs - now.minutes;
      li.appendChild(el("div", "eta" + (mins >= 60 ? " far" : ""), etaText(mins)));
      ul.appendChild(li);
    });
    const more = el("button", "more", state.more[sec.key] ? "Ver menos" : "Ver más salidas"); more.type = "button";
    more.onclick = () => { state.more[sec.key] = !state.more[sec.key]; render(); };
    card.appendChild(more);
  }
  if (state.view === "completa") renderTrips(s, activeDest(s), now, holiday);
}

function render(){
  const now = nowBA(), s = currentStation(), st = ST[s], r = ranked();
  const holiday = state.holidayDate === now.date;
  if (state.holidayDate && !holiday) { state.holidayDate = null; store.set("bn.feriado", null); }   // el feriado vale solo por un día

  $("clock").textContent = now.hhmm;
  $("stName").textContent = st.nombre;
  const auto = state.manual === null;
  $("modeLabel").textContent = auto ? (state.pos ? "Origen · estación más cercana" : "Origen") : "Origen elegido a mano";

  const sub = $("stSub"); sub.textContent = "";
  sub.appendChild(el("span", "badge", auto ? "GPS" : "Manual"));
  let txt = "";
  if (r) { const me = r.find(x => x.id === s); txt = "a " + fmtDist(me.km) + " de tu ubicación"; }
  else if (state.locating) txt = "Buscando tu ubicación...";
  else if (auto) txt = "Sin ubicación";
  sub.appendChild(document.createTextNode(txt));

  const near = $("near"); near.textContent = "";
  if (r) {
    r.filter(x => x.id !== s).slice(0, auto ? 2 : 3).forEach(x => {
      const b = el("button", "chip", ST[x.id].nombre + " · " + fmtDist(x.km)); b.type = "button";
      b.onclick = () => setManual(x.id); near.appendChild(b);
    });
  }
  const notice = $("notice");
  if (auto && !state.pos && !state.locating && state.geoError) {
    notice.hidden = false;
    notice.textContent = state.geoError + " Se muestra " + st.nombre + ". Elegí el origen con el botón Cambiar origen.";
  } else notice.hidden = true;

  const btnH = $("btnHoliday");
  btnH.setAttribute("aria-pressed", holiday ? "true" : "false");
  btnH.textContent = holiday ? "Feriado activado" : "Hoy es feriado";

  const type = holiday ? "dyf" : dayTypeOfDow(now.dow);
  const dt = $("dayType"); dt.textContent = "Horario de hoy: ";
  dt.appendChild(el("b", "", DAY_NAMES[type] + (holiday && now.dow !== 0 ? " (feriado marcado)" : "")));

  const d = activeDest(s);
  $("destName").textContent = d ? ST[d.id].nombre : "Todos los trenes";
  $("destNote").textContent = d ? sentido(s, d.id) + (d.fav ? " · favorito" + (d.auto ? " automático" : "") : "") : (s === 0 ? "sentido Villa Rosa" : s === LAST ? "sentido Retiro" : "ambos sentidos");
  $("btnSwap").disabled = !d;
  const star = $("btnStar"), saved = d && tripIndex(s, d.id) >= 0;
  star.disabled = !d;
  star.textContent = saved ? "★" : "☆";
  star.setAttribute("aria-pressed", saved ? "true" : "false");
  star.setAttribute("aria-label", saved ? "Quitar trayecto de favoritos" : "Guardar trayecto favorito");
  $("btnFavs").textContent = state.trips.length ? "Trayectos favoritos (" + state.trips.length + " de " + MAX_TRIPS + ")" : "Agregar trayectos favoritos";
  renderSections(s, now, holiday);
  $("foot").textContent = "Horario N° " + DATA.meta.horario_numero + " de " + DATA.meta.operador + ", vigente desde el " + DATA.meta.vigente_desde.split("-").reverse().join("/") + ". Horarios programados, no en tiempo real. Sitio no oficial.";
}

function setManual(id){
  state.manual = id; store.set("bn.manual", id === null ? null : String(id));
  state.more = {};
  closeSheet(); render();
  if (id === null) locate();
}

function openSheet(){
  const list = $("sheetList"), r = ranked(), cur = currentStation(), d = activeDest(cur); list.textContent = "";
  $("sheetTitle").textContent = "Elegir origen"; $("sheetClose").textContent = "Cerrar";
  const a = el("button", "opt auto" + (state.manual === null ? " sel" : "")); a.type = "button";
  a.appendChild(el("span", "", "Automático (GPS)")); a.appendChild(el("small", "", r ? "más cercana: " + ST[r[0].id].nombre : ""));
  a.onclick = () => setManual(null); list.appendChild(a);
  const add = e => {
    const b = el("button", "opt" + (state.manual !== null && e.id === cur ? " sel" : "")); b.type = "button";
    b.appendChild(el("span", "", e.nombre));
    if (r) b.appendChild(el("small", "", fmtDist(r.find(x => x.id === e.id).km)));
    b.onclick = () => setManual(e.id); list.appendChild(b);
  };
  ST.filter(e => !(d && !d.auto && e.id === d.id)).forEach(add);   // origen y destino nunca coinciden
  $("sheet").classList.add("open");
}

/* Editor de trayectos favoritos: quitar existentes y agregar nuevos en dos pasos */
function openTrips(first){
  const list = $("sheetList"); list.textContent = "";
  $("sheetTitle").textContent = "Trayectos favoritos"; $("sheetClose").textContent = "Listo";
  const reopen = f => { const top = list.scrollTop; openTrips(f); list.scrollTop = top; render(); };
  if (first === undefined) {
    list.appendChild(el("div", "hint", "Hasta " + MAX_TRIPS + " trayectos. Cada uno vale en los dos sentidos: la app lo muestra desde el extremo donde estés."));
    state.trips.forEach((p, i) => {
      const b = el("button", "opt sel"); b.type = "button";
      b.appendChild(el("span", "", ST[p[0]].nombre + " ⇄ " + ST[p[1]].nombre));
      b.appendChild(el("span", "mark", "★ Quitar"));
      b.onclick = () => { state.trips.splice(i, 1); saveTrips(); reopen(); };
      list.appendChild(b);
    });
    if (state.trips.length >= MAX_TRIPS) { list.appendChild(el("div", "hint", "Llegaste al máximo. Quitá uno para agregar otro.")); }
    else {
      list.appendChild(el("div", "group", "Agregar trayecto: elegí la primera estación"));
      ST.forEach(e => {
        const b = el("button", "opt"); b.type = "button";
        b.appendChild(el("span", "", e.nombre)); b.appendChild(el("span", "mark", "Elegir"));
        b.onclick = () => { openTrips(e.id); list.scrollTop = 0; };
        list.appendChild(b);
      });
    }
  } else {
    const back = el("button", "opt auto"); back.type = "button";
    back.appendChild(el("span", "", "← Cancelar")); back.appendChild(el("small", "", "primera: " + ST[first].nombre));
    back.onclick = () => { openTrips(); list.scrollTop = 0; };
    list.appendChild(back);
    list.appendChild(el("div", "group", "Elegí la segunda estación"));
    ST.filter(e => e.id !== first).forEach(e => {
      const dup = tripIndex(first, e.id) >= 0, b = el("button", "opt" + (dup ? " dis" : "")); b.type = "button";
      b.appendChild(el("span", "", e.nombre)); b.appendChild(el("small", "", dup ? "ya es favorito" : sentido(first, e.id)));
      b.onclick = () => { if (dup) return; state.trips.push([first, e.id]); saveTrips(); openTrips(); list.scrollTop = 0; render(); };
      list.appendChild(b);
    });
  }
  $("sheet").classList.add("open");
}

/* Selector de destino del trayecto activo, desde el origen s (nunca ofrece el propio origen) */
function openDestino(){
  const s = currentStation(), list = $("sheetList"); list.textContent = "";
  $("sheetTitle").textContent = "Destino desde " + ST[s].nombre; $("sheetClose").textContent = "Cerrar";
  const pick = v => { setDestSel(v); closeSheet(); render(); };
  const opt = (cls, label, note, v, sel) => {
    const b = el("button", "opt" + cls + (sel ? " sel" : "")); b.type = "button";
    b.appendChild(el("span", "", label)); if (note) b.appendChild(el("small", "", note));
    b.onclick = () => pick(v); list.appendChild(b);
  };
  const favHere = state.trips.filter(p => p[0] === s || p[1] === s).map(p => p[0] === s ? p[1] : p[0]);
  const sel = state.destSel, num = typeof sel === "number" && sel !== s;
  opt(" auto", "Automático", favHere.length ? "favorito: " + ST[favHere[0]].nombre : "favorito desde aquí o todos los trenes", "auto", !num && sel !== "todos");
  opt("", "Todos los trenes", "ambos sentidos", "todos", sel === "todos");
  const shown = new Set([s]);
  if (favHere.length) {
    list.appendChild(el("div", "group", "Trayectos favoritos desde aquí"));
    favHere.forEach(id => { shown.add(id); opt("", ST[id].nombre, sentido(s, id), id, num && sel === id); });
  }
  const cabs = ST.filter(e => !shown.has(e.id) && (CABECERAS.ida.has(e.id) || CABECERAS.vuelta.has(e.id)));
  if (cabs.length) {
    list.appendChild(el("div", "group", "Cabeceras"));
    cabs.forEach(e => { shown.add(e.id); opt("", e.nombre, sentido(s, e.id), e.id, num && sel === e.id); });
  }
  list.appendChild(el("div", "group", "Otras estaciones"));
  ST.filter(e => !shown.has(e.id)).forEach(e => opt("", e.nombre, sentido(s, e.id), e.id, num && sel === e.id));
  $("sheet").classList.add("open");
}

/* Ajustes: forma de la pantalla principal */
function openSettings(){
  const list = $("sheetList"); list.textContent = "";
  $("sheetTitle").textContent = "Ajustes"; $("sheetClose").textContent = "Listo";
  list.appendChild(el("div", "group", "Vista de la pantalla principal"));
  [["completa", "Completa", "trayecto activo y los demás favoritos"], ["simple", "Simple", "solo el trayecto activo"]].forEach(([v, label, note]) => {
    const b = el("button", "opt" + (state.view === v ? " sel" : "")); b.type = "button";
    b.appendChild(el("span", "", label)); b.appendChild(el("small", "", note));
    b.onclick = () => { state.view = v; store.set("bn.vista", v); openSettings(); render(); };
    list.appendChild(b);
  });
  $("sheet").classList.add("open");
}

/* Selector de cabecera destino para un sentido, desde la estación s */
function openDest(dir, s){
  const list = $("sheetList"); list.textContent = "";
  const terminal = dir === "ida" ? "Villa Rosa" : "Retiro";
  $("sheetTitle").textContent = "Destino sentido " + terminal; $("sheetClose").textContent = "Cerrar";
  const ahead = ST.filter(e => dir === "ida" ? e.id > s : e.id < s);
  if (dir === "vuelta") ahead.reverse();                         // orden de marcha
  const cur = state.dest[dir], curValid = ahead.some(e => e.id === cur);
  const pick = id => {
    state.dest[dir] = id; store.set("bn.destino", JSON.stringify(state.dest));
    state.more = {}; closeSheet(); render();
  };
  const opt = (label, note, id, sel) => {
    const b = el("button", "opt" + (sel ? " sel" : "")); b.type = "button";
    b.appendChild(el("span", "", label)); if (note) b.appendChild(el("small", "", note));
    b.onclick = () => pick(id); list.appendChild(b);
  };
  const all = el("button", "opt auto" + (!curValid ? " sel" : "")); all.type = "button";
  all.appendChild(el("span", "", "Todos los trenes")); all.appendChild(el("small", "", "cualquier cabecera"));
  all.onclick = () => pick(null); list.appendChild(all);
  const cabs = ahead.filter(e => CABECERAS[dir].has(e.id)), rest = ahead.filter(e => !CABECERAS[dir].has(e.id));
  if (cabs.length) {
    list.appendChild(el("div", "group", "Cabeceras"));
    cabs.forEach(e => opt(e.nombre, "terminal de servicios", e.id, curValid && e.id === cur));
  }
  if (rest.length) {
    list.appendChild(el("div", "group", "Otras estaciones"));
    rest.forEach(e => opt(e.nombre, "", e.id, curValid && e.id === cur));
  }
  $("sheet").classList.add("open");
}

function closeSheet(){ $("sheet").classList.remove("open"); }

$("btnStation").onclick = openSheet;
$("btnFavs").onclick = () => openTrips();
$("btnDest").onclick = openDestino;
$("btnSettings").onclick = openSettings;
$("btnSwap").onclick = () => {
  const s = currentStation(), d = activeDest(s); if (!d) return;
  state.manual = d.id; store.set("bn.manual", String(d.id)); setDestSel(s); render();
};
$("btnStar").onclick = () => {
  const s = currentStation(), d = activeDest(s); if (!d) return;
  const i = tripIndex(s, d.id);
  if (i >= 0) state.trips.splice(i, 1);
  else if (state.trips.length < MAX_TRIPS) state.trips.push([s, d.id]);
  else { openTrips(); return; }                                  // lleno: abrir el editor para quitar uno
  saveTrips(); render();
};
$("sheetClose").onclick = closeSheet;
$("sheet").onclick = e => { if (e.target.id === "sheet") closeSheet(); };
$("btnHoliday").onclick = () => {
  const today = nowBA().date;
  state.holidayDate = state.holidayDate === today ? null : today;
  store.set("bn.feriado", state.holidayDate); render();
};
render();
locate();
setInterval(render, 15000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) { render(); locate(); } });

/* Instalación como app en Android (solo cuando se sirve por HTTPS con sw.js al lado) */
try { if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {}); } catch (e) {}
})().catch(function(){
  document.getElementById("stName").textContent = "Sin datos";
  document.getElementById("stSub").textContent = "No se pudieron cargar los horarios. Revisá la conexión y recargá la página.";
});
</script>
</body>
</html>
